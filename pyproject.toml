[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "code2doc"
version = "0.1.0"
description = "Multi-agent code documentation generator using AWS Bedrock"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Code2Doc Team" }
]
keywords = ["documentation", "code-analysis", "aws-bedrock", "multi-agent", "gitlab", "confluence"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Documentation",
    "Topic :: Software Development :: Documentation",
]

dependencies = [
    "boto3>=1.34.0",
    "botocore>=1.34.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "python-dotenv>=1.0.0",
    "python-gitlab>=4.0.0",
    "atlassian-python-api>=3.41.0",
    "pyyaml>=6.0.0",
    "httpx>=0.25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
    "pre-commit>=3.6.0",
    "types-pyyaml>=6.0.0",
    "boto3-stubs[bedrock-agent,bedrock-agent-runtime]>=1.34.0",
]

[project.scripts]
code2doc = "code2doc.cli.main:app"

[project.urls]
Homepage = "https://github.com/your-org/code-2-doc"
Documentation = "https://github.com/your-org/code-2-doc#readme"
Repository = "https://github.com/your-org/code-2-doc"
Issues = "https://github.com/your-org/code-2-doc/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/code2doc"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults
    "B905",   # zip without explicit strict
]

[tool.ruff.lint.isort]
known-first-party = ["code2doc"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
strict_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
namespace_packages = true
explicit_package_bases = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = [
    "gitlab.*",
    "atlassian.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --cov=code2doc --cov-report=term-missing"

[tool.coverage.run]
source = ["src/code2doc"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
